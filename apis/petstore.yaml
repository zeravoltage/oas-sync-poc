openapi: 3.0.0
info:
  title: Petstore POC
  version: 1.0.0
  description: >-
    Demo API for the Redocly <-> GitHub <-> SwaggerHub two-way sync POC.
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/xyz-cb7-d78/Petstore-POC/1.0.0
  - url: https://api.example.com/v1
paths:
   /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Create a pet
      operationId: createPet
      responses:
        '201':
          description: Created
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        tag: { type: string }